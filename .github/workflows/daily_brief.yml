name: AI Aktie Rådgiver — Daglig Scanning

on:
  schedule:
    - cron: "0 5 * * 1-5"   # Mandag–fredag kl 07:00 dansk sommertid

  workflow_dispatch:
    inputs:
      scanning_type:
        description: "Scanning type"
        required: true
        default: "komplet"
        type: choice
        options:
          - hurtig
          - komplet

jobs:
  daglig-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fuld git-historik — kræves af 'engine.py backfill'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer afhængigheder
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hent makro (VIX + SP500 + renter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py makro

      - name: Kør screener (alle sektorer)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ "${{ github.event.inputs.scanning_type }}" = "hurtig" ]; then
            python engine.py screener
          else
            python engine.py screener --komplet
          fi

      - name: Groq 70b dyb analyse af top kandidater
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py dyb

      - name: Re-analysér aktive handler (trailing stop, tids-stop, sælg-signaler)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py reanalyser

      - name: Genskab ML-trænings-data fra git-historik (idempotent, springer over kendte)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py backfill

      - name: Backtest tidligere anbefalinger (30-dages afkast)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py backtest

      - name: Gentræn ML-model (kører kun når der er nok data)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py train

      - name: Gem resultater til repository
        run: |
          git config user.name  "AI Aktie Bot"
          git config user.email "bot@ai-aktie-raadgiver.dk"
          git add data/screener_seneste.json data/daily_brief_seneste.json data/makro_seneste.json || true
          git add data/alerts.json data/reanalyse_seneste.json || true
          git add data/backtest_historik.json data/backtest_resultater.json || true
          git add data/ml_training_data.json data/ml_model.pkl || true
          git add data/aktive_handler.json || true
          git diff --staged --quiet || git commit -m "📈 Daglig scanning $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      # ── Send Discord notifikation ──────────────────────────
      - name: Send Discord notifikation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_ACTIONS: "true"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 << 'PYTHON'
          import json, os, re, requests
          import engine  # genbruger beregn_position så Kelly-logik ikke duplikeres

          discord_url = os.getenv("DISCORD_WEBHOOK", "")
          if not discord_url:
              print("Ingen DISCORD_WEBHOOK sat — springer over")
              exit(0)

          def load(sti, default=None):
              try:
                  with open(sti, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default if default is not None else {}

          brief     = load("data/daily_brief_seneste.json", {})
          makro     = load("data/makro_seneste.json", {})
          reanalyse = load("data/reanalyse_seneste.json", {})
          portfolio = load("data/portfolio.json", {})

          dato  = brief.get("dato", "ukendt")
          vix   = float(makro.get("vix", 0) or 0)
          sp    = makro.get("sp_status", "?")
          sp1m  = float(makro.get("sp_1m_afkast", 0) or 0)
          just  = float(makro.get("justering", 0) or 0)
          kands = brief.get("top_kandidater", [])

          cash_usd = float(portfolio.get("cash", {}).get("etoro_usd", 0))
          cash_dkk = float(portfolio.get("cash", {}).get("nordnet_dkk", 0))
          circuit_faktor, circuit_besked = engine.hent_circuit_breaker_faktor()
          print(f"Cirkelbryder: {circuit_besked}")

          # Discord embed farve: grøn hvis bull, rød hvis bear
          embed_farve = 0x4ade80 if "Optrend" in sp else 0xf87171

          fields = []
          fields.append({
              "name": "📊 Makro",
              "value": f"VIX **{vix:.1f}** | SP500 **{sp}** {sp1m:+.1f}% 1M | Justering **{just:+.1f}**",
              "inline": False
          })

          if circuit_faktor < 1.0:
              fields.append({
                  "name": "🛑 Cirkelbryder aktiv",
                  "value": circuit_besked,
                  "inline": False
              })

          # ── Sælg/hold-signaler for aktive positioner (kommer FØRST — det du skal handle på) ──
          sael_linjer = []
          for r in reanalyse.get("resultater", []):
              if r.get("flag"):
                  sael_linjer.append(f"🔴 **{r['ticker']}** ({r['afkast']:+.1f}%) — " + " · ".join(r["flag"]))
          if sael_linjer:
              fields.append({
                  "name": "⚠️ Handling påkrævet på dine positioner",
                  "value": "\n".join(sael_linjer[:8]),
                  "inline": False
              })

          # ── Købssignaler — én kompakt linje pr. aktie ──────
          if kands:
              koeb_linjer = []
              for r in kands[:5]:
                  analyse = r.get("analyse", "")
                  anb_m    = re.search(r"ANBEFALING[:\s]+([A-ZÆØÅ ]+)", analyse)
                  entry_m  = re.search(r"ENTRY PRIS[:\s]+\$?([\d,.]+)", analyse)
                  stop_m   = re.search(r"STOP LOSS[:\s]+\$?([\d,.]+)", analyse)
                  target_m = re.search(r"TARGET PRIS[:\s]+\$?([\d,.]+)", analyse)

                  anb    = anb_m.group(1).strip()    if anb_m    else "VENT"
                  entry  = entry_m.group(1)          if entry_m  else "?"
                  stop   = stop_m.group(1)           if stop_m   else "?"
                  target = target_m.group(1)         if target_m else "?"
                  score  = r.get("kombineret", r.get("screener", "?"))
                  sektor = r.get("sektor", "")
                  ticker = r.get("ticker", "")

                  emoji = "🟢" if "KØB" in anb else ("🔴" if "SÆLG" in anb else "🟡")

                  try:
                      pos = engine.beregn_position(float(score or 0), cash_dkk, cash_usd, ticker.endswith(".CO"), circuit_faktor=circuit_faktor)
                      beloeb_txt = f"{pos['beloeb']} {pos['valuta']} ({pos['platform']})"
                  except Exception:
                      beloeb_txt = "se app"

                  koeb_linjer.append(
                      f"{emoji} **{ticker}** ({sektor}) — {anb} **{score}/10** · "
                      f"${entry} → ${target} (SL ${stop}) · {beloeb_txt}"
                  )
              fields.append({
                  "name": f"📈 Købssignaler ({len(kands)})",
                  "value": "\n".join(koeb_linjer),
                  "inline": False
              })
          else:
              fields.append({
                  "name": "📭 Ingen købssignaler",
                  "value": "Ingen aktier passerede conviction-filteret i dag.",
                  "inline": False
              })

          payload = {
              "username": "AI Aktie Rådgiver",
              "avatar_url": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
              "embeds": [{
                  "title": f"📈 Daglig Scanning — {dato}",
                  "color": embed_farve,
                  "fields": fields,
                  "footer": {
                      "text": "Groq 70b · RSI/MACD · Trend/Momentum/Earnings-filter · ML-model"
                  }
              }]
          }

          r = requests.post(discord_url, json=payload, timeout=15)
          if r.status_code in [200, 204]:
              print(f"Discord notifikation sendt! ({len(kands)} køb, {len(sael_linjer)} handlings-flag)")
          else:
              print(f"Discord fejl: {r.status_code} — {r.text}")
          PYTHON
