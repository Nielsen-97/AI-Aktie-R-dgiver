name: AI Aktie Rådgiver — Daglig Scanning

on:
  schedule:
    - cron: "0 5 * * 1-5"   # Mandag–fredag kl 07:00 dansk sommertid

  workflow_dispatch:
    inputs:
      scanning_type:
        description: "Scanning type"
        required: true
        default: "komplet"
        type: choice
        options:
          - hurtig
          - komplet

jobs:
  daglig-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer afhængigheder
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hent makro (VIX + SP500 + renter)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py makro

      - name: Kør screener (alle sektorer)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ "${{ github.event.inputs.scanning_type }}" = "hurtig" ]; then
            python engine.py screener
          else
            python engine.py screener --komplet
          fi

      - name: Groq 70b dyb analyse af top kandidater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py dyb

      - name: Re-analysér aktive handler
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py reanalyser

      - name: Backtest tidligere anbefalinger
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py backtest

      - name: ML backfill og træning
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          python engine.py backfill
          python engine.py train

      - name: Gem resultater til repository
        run: |
          git config user.name  "AI Aktie Bot"
          git config user.email "bot@ai-aktie-raadgiver.dk"
          git add data/screener_seneste.json data/daily_brief_seneste.json data/makro_seneste.json || true
          git add data/alerts.json data/reanalyse_seneste.json || true
          git add data/backtest_historik.json data/backtest_resultater.json || true
          git add data/ml_training_data.json data/ml_model.pkl || true
          git add data/aktive_handler.json || true
          git diff --staged --quiet || git commit -m "📈 Daglig scanning $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Send Discord notifikation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_DEMO: ${{ secrets.ETORO_DEMO }}
          GITHUB_ACTIONS: "true"
        run: |
          python3 << 'PYTHON'
          import json, os, requests
          import engine  # genbruger hent_discord_signaler/beregn_handelsgebyr/hent_cash_saldi — ingen duplikeret logik

          discord_url = os.getenv("DISCORD_WEBHOOK", "")
          if not discord_url:
              print("Ingen DISCORD_WEBHOOK — springer over")
              exit(0)

          def load(sti):
              try:
                  with open(sti, encoding="utf-8") as f: return json.load(f)
              except: return {}

          makro     = load("data/makro_seneste.json")
          reanalyse = load("data/reanalyse_seneste.json")
          brief     = engine.hent_brief_data() or {}

          vix   = float(makro.get("vix", 0) or 0)
          sp    = makro.get("sp_status", "?")
          sp1m  = float(makro.get("sp_1m_afkast", 0) or 0)
          dato  = brief.get("dato", "ukendt")

          # eToro-saldoen hentes LIVE fra API'et her hvis nøgler er sat —
          # portfolio.json bruges kun som fallback (se engine.hent_cash_saldi).
          saldi = engine.hent_cash_saldi()
          cash_usd    = saldi["etoro_usd"]
          cash_dkk    = saldi["nordnet_dkk"]
          cash_endavu = saldi["endavu_dkk"]

          farve = 0x4ade80 if "Optrend" in sp else 0xf87171

          # Makro linje
          vix_emoji = "🟢" if vix < 20 else "🟡" if vix < 27 else "🔴"
          makro_linje = f"{vix_emoji} VIX {vix:.0f} · SP500 {sp} {sp1m:+.1f}% · {dato}"

          # Sælg-signaler og eksplicitte stop-loss-opdateringer FØRST
          sael_linjer = []
          for r in reanalyse.get("resultater", []):
              platform = (r.get("platform") or "").upper() or "ETORO/NORDNET"
              if r.get("trailing_stop_hoejet"):
                  sael_linjer.append(
                      f"⚠️ **OPDATER STOP-LOSS TIL ${r.get('stop_loss')} PÅ {platform} NU** — {r['ticker']}"
                  )
              if r.get("flag"):
                  afk  = r.get("afkast", 0) or 0
                  flag = r["flag"][0] if r.get("flag") else ""
                  sael_linjer.append(f"🔴 **{r['ticker']}** {afk:+.1f}% — {flag}")

          # Køb — samme nummererede liste som 'købt X'-svar matcher mod
          koeb_linjer = []
          for s in engine.hent_discord_signaler():
              ticker = s["ticker"]
              score  = s["score"]
              entry  = s["entry"]  if s["entry"]  is not None else "?"
              stop   = s["stop_loss"] if s["stop_loss"] is not None else "?"
              target = s["target"] if s["target"] is not None else "?"

              er_dansk = ticker.endswith(".CO")
              pos = engine.beregn_position(score, cash_dkk, cash_usd, er_dansk=er_dansk)
              beloeb_dkk = pos["beloeb"] if pos["valuta"] == "DKK" else round(pos["beloeb"] * engine.hent_usd_dkk_kurs())

              gebyr = engine.beregn_handelsgebyr(ticker, beloeb_dkk, cash_dkk, cash_usd, cash_endavu)

              if gebyr["utilstraekkelig_cash"]:
                  invester_linje = "Investér: ingen platform har nok kapital til denne handel"
              elif gebyr["gebyr_for_hoej"]:
                  invester_linje = (
                      f"Investér: {pos['beloeb']} {pos['valuta']} · ⚠️ gebyr {gebyr['gebyr_pct']*100:.1f}% "
                      f"— for højt, spring over"
                  )
              else:
                  invester_linje = (
                      f"Investér: {pos['beloeb']} {pos['valuta']} · {gebyr['platform']} "
                      f"· gebyr ~{gebyr['omkostning_dkk']:.0f} DKK ({gebyr['gebyr_pct']*100:.1f}%)"
                  )

              koeb_linjer.append(
                  f"🟢 **[{s['index']}] {ticker}** · Score {score}/10\n"
                  f"   Køb: **${entry}** · Stop: ${stop} · Mål: ${target}\n"
                  f"   {invester_linje}"
              )

          # Byg beskeden
          dele = [makro_linje, ""]

          if sael_linjer:
              dele.append("**⚠️ HANDLING PÅKRÆVET**")
              dele.extend(sael_linjer)
              dele.append("")

          if koeb_linjer:
              dele.append("**📈 KØB I DAG** · svar med `købt 1`, `købt 2` eller `købt 3` (evt. + pris) for at registrere en handel")
              dele.append("")
              dele.append("\n\n".join(koeb_linjer))
          else:
              dele.append("**📭 Ingen signaler i dag**")

          payload = {
              "username": "AI Aktie Rådgiver",
              "embeds": [{
                  "description": "\n".join(dele),
                  "color": farve
              }]
          }

          r = requests.post(discord_url, json=payload, timeout=15)
          print(f"Discord: {r.status_code} — {len(koeb_linjer)} køb, {len(sael_linjer)} sælg")
          PYTHON
