name: AI Aktie Rådgiver — Daglig Scanning

on:
  schedule:
    - cron: "0 5 * * 1-5"   # Mandag–fredag kl 07:00 dansk sommertid

  workflow_dispatch:
    inputs:
      scanning_type:
        description: "Scanning type"
        required: true
        default: "komplet"
        type: choice
        options:
          - hurtig
          - komplet

jobs:
  daglig-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer afhængigheder
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hent makro (VIX + SP500 + renter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py makro

      - name: Kør screener (alle sektorer)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ "${{ github.event.inputs.scanning_type }}" = "hurtig" ]; then
            python engine.py screener
          else
            python engine.py screener --komplet
          fi

      - name: Groq 70b dyb analyse af top kandidater
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py dyb

      - name: Gem resultater til repository
        run: |
          git config user.name  "AI Aktie Bot"
          git config user.email "bot@ai-aktie-raadgiver.dk"
          git add data/screener_seneste.json data/daily_brief_seneste.json data/makro_seneste.json || true
          git add data/alerts.json || true
          git diff --staged --quiet || git commit -m "📈 Daglig scanning $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      # ── Send Discord notifikation ──────────────────────────
      - name: Send Discord notifikation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_ACTIONS: "true"
        run: |
          python3 << 'PYTHON'
          import json, os, re, requests

          discord_url = os.getenv("DISCORD_WEBHOOK", "")
          if not discord_url:
              print("Ingen DISCORD_WEBHOOK sat — springer over")
              exit(0)

          # Læs brief
          try:
              with open("data/daily_brief_seneste.json", encoding="utf-8") as f:
                  brief = json.load(f)
          except Exception as e:
              print(f"Kunne ikke læse brief: {e}")
              brief = {}

          # Læs makro
          try:
              with open("data/makro_seneste.json", encoding="utf-8") as f:
                  makro = json.load(f)
          except:
              makro = {}

          dato  = brief.get("dato", "ukendt")
          vix   = float(makro.get("vix", 0) or 0)
          sp    = makro.get("sp_status", "?")
          sp1m  = float(makro.get("sp_1m_afkast", 0) or 0)
          just  = float(makro.get("justering", 0) or 0)
          kands = brief.get("top_kandidater", [])

          # Discord embed farve: grøn hvis bull, rød hvis bear
          embed_farve = 0x4ade80 if "Optrend" in sp else 0xf87171

          # Byg embed fields for hvert signal
          fields = []

          # Makro felt
          fields.append({
              "name": "📊 Makro",
              "value": f"VIX **{vix:.1f}** | SP500 **{sp}** {sp1m:+.1f}% 1M | Justering **{just:+.1f}**",
              "inline": False
          })

          if kands:
              for r in kands[:5]:  # Max 5 signaler
                  analyse = r.get("analyse", "")

                  anb_m    = re.search(r"ANBEFALING[:\s]+([A-ZÆØÅ ]+)", analyse)
                  entry_m  = re.search(r"ENTRY PRIS[:\s]+\$?([\d,.]+)", analyse)
                  stop_m   = re.search(r"STOP LOSS[:\s]+\$?([\d,.]+)", analyse)
                  target_m = re.search(r"TARGET PRIS[:\s]+\$?([\d,.]+)", analyse)
                  prob_m   = re.search(r"SANDSYNLIGHED[:\s]+(\d+)%?", analyse)
                  res_m    = re.search(r"RESUMÉ[:\s]+(.{10,120})", analyse)

                  anb    = anb_m.group(1).strip()    if anb_m    else "VENT"
                  entry  = entry_m.group(1)          if entry_m  else "?"
                  stop   = stop_m.group(1)           if stop_m   else "?"
                  target = target_m.group(1)         if target_m else "?"
                  prob   = prob_m.group(1)           if prob_m   else "?"
                  resume = res_m.group(1).strip()    if res_m    else ""

                  score  = r.get("kombineret", r.get("screener", "?"))
                  sektor = r.get("sektor", "")

                  # Emoji baseret på anbefaling
                  if "KØB" in anb:
                      emoji = "🟢"
                  elif "SÆLG" in anb:
                      emoji = "🔴"
                  else:
                      emoji = "🟡"

                  felt_tekst = (
                      f"**{anb}** — Score {score}/10\n"
                      f"Entry: **${entry}** | Stop: ${stop} | Target: **${target}**\n"
                      f"Sandsynlighed: {prob}%\n"
                  )
                  if resume:
                      felt_tekst += f"_{resume[:100]}_"

                  fields.append({
                      "name": f"{emoji} {r['ticker']} · {sektor}",
                      "value": felt_tekst,
                      "inline": False
                  })
          else:
              fields.append({
                  "name": "📭 Ingen signaler",
                  "value": "Ingen aktier passerede conviction-filteret i dag.",
                  "inline": False
              })

          # Byg Discord payload
          payload = {
              "username": "AI Aktie Rådgiver",
              "avatar_url": "https://cdn-icons-png.flaticon.com/512/2103/2103633.png",
              "embeds": [{
                  "title": f"📈 Daglig Scanning — {dato}",
                  "color": embed_farve,
                  "fields": fields,
                  "footer": {
                      "text": "Groq 70b · RSI/MACD · Insider · Conviction filter"
                  }
              }]
          }

          # Send til Discord
          r = requests.post(discord_url, json=payload, timeout=15)
          if r.status_code in [200, 204]:
              print(f"Discord notifikation sendt! ({len(kands)} signaler)")
          else:
              print(f"Discord fejl: {r.status_code} — {r.text}")
          PYTHON
