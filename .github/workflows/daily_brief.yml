name: AI Aktie Rådgiver — Daglig Scanning

on:
  schedule:
    - cron: "0 5 * * 1-5"   # Mandag–fredag kl 07:00 dansk sommertid

  workflow_dispatch:
    inputs:
      scanning_type:
        description: "Scanning type"
        required: true
        default: "komplet"
        type: choice
        options:
          - hurtig
          - komplet

jobs:
  daglig-scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer afhængigheder
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hent makro (VIX + SP500 + renter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py makro

      - name: Kør screener (alle sektorer)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          if [ "${{ github.event.inputs.scanning_type }}" = "hurtig" ]; then
            python engine.py screener
          else
            python engine.py screener --komplet
          fi

      - name: Groq 70b dyb analyse af top kandidater
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py dyb

      - name: Re-analysér aktive handler
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py reanalyser

      - name: Backtest tidligere anbefalinger
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: python engine.py backtest

      - name: ML backfill og træning
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          python engine.py backfill
          python engine.py train

      - name: Gem resultater til repository
        run: |
          git config user.name  "AI Aktie Bot"
          git config user.email "bot@ai-aktie-raadgiver.dk"
          git add data/screener_seneste.json data/daily_brief_seneste.json data/makro_seneste.json || true
          git add data/alerts.json data/reanalyse_seneste.json || true
          git add data/backtest_historik.json data/backtest_resultater.json || true
          git add data/ml_training_data.json data/ml_model.pkl || true
          git add data/aktive_handler.json || true
          git diff --staged --quiet || git commit -m "📈 Daglig scanning $(date +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Send Discord notifikation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_ACTIONS: "true"
        run: |
          python3 << 'PYTHON'
          import json, os, re, requests
          import engine  # genbruger beregn_position: Kelly + cirkelbryder + bredde +
                          # R:R-skalering + risikoloft + min.-position — ingen duplikeret logik her

          discord_url = os.getenv("DISCORD_WEBHOOK", "")
          if not discord_url:
              print("Ingen DISCORD_WEBHOOK — springer over")
              exit(0)

          def load(sti):
              try:
                  with open(sti, encoding="utf-8") as f: return json.load(f)
              except: return {}

          brief     = load("data/daily_brief_seneste.json")
          makro     = load("data/makro_seneste.json")
          reanalyse = load("data/reanalyse_seneste.json")
          portfolio = load("data/portfolio.json")

          vix   = float(makro.get("vix", 0) or 0)
          sp    = makro.get("sp_status", "?")
          sp1m  = float(makro.get("sp_1m_afkast", 0) or 0)
          dato  = brief.get("dato", "ukendt")
          kands = brief.get("top_kandidater", [])
          cash_usd    = float(portfolio.get("cash", {}).get("etoro_usd", 0))
          cash_dkk    = float(portfolio.get("cash", {}).get("nordnet_dkk", 0))
          cash_endavu = float(portfolio.get("cash", {}).get("endavu_dkk", 0))

          circuit_faktor, circuit_besked = engine.hent_circuit_breaker_faktor()
          bredde_faktor = float(makro.get("bredde_faktor", 1.0) or 1.0)
          samlet_faktor = circuit_faktor * bredde_faktor
          print(f"Cirkelbryder: {circuit_besked} | Bredde-faktor: {bredde_faktor}")

          try:
              total_portfolio_dkk = engine.beregn_total_portfolio_vaerdi_dkk(portfolio)
          except Exception as e:
              print(f"Kunne ikke beregne total portefølje-værdi: {e}")
              total_portfolio_dkk = None

          farve = 0x4ade80 if "Optrend" in sp else 0xf87171

          # Makro linje
          vix_emoji = "🟢" if vix < 20 else "🟡" if vix < 27 else "🔴"
          makro_linje = f"{vix_emoji} VIX {vix:.0f} · SP500 {sp} {sp1m:+.1f}% · {dato}"
          if samlet_faktor < 1.0:
              makro_linje += f"\n🛡️ Positioner skåret til {samlet_faktor*100:.0f}% (cirkelbryder/bredde)"

          # Sælg-signaler FØRST
          sael_linjer = []
          for r in reanalyse.get("resultater", []):
              if r.get("flag"):
                  afk  = r.get("afkast", 0) or 0
                  flag = r["flag"][0] if r.get("flag") else ""
                  sael_linjer.append(f"🔴 **{r['ticker']}** {afk:+.1f}% — {flag}")

          # Køb — maks 3, fjern duplikater
          set_tickers = set()
          unikke = []
          for r in kands:
              if r["ticker"] not in set_tickers:
                  set_tickers.add(r["ticker"])
                  unikke.append(r)

          koeb_linjer = []
          for r in unikke[:3]:
              analyse = r.get("analyse", "")
              ticker  = r["ticker"]
              score   = float(r.get("kombineret", r.get("screener", 5)) or 5)

              entry_m  = re.search(r"ENTRY PRIS[:\s]+\$?([\d,.]+)", analyse)
              stop_m   = re.search(r"STOP LOSS[:\s]+\$?([\d,.]+)", analyse)
              target_m = re.search(r"TARGET PRIS[:\s]+\$?([\d,.]+)", analyse)

              entry  = entry_m.group(1)  if entry_m  else None
              stop   = stop_m.group(1)   if stop_m   else None
              target = target_m.group(1) if target_m else None
              entry_f  = float(entry.replace(",", ""))  if entry  else None
              stop_f   = float(stop.replace(",", ""))   if stop   else None
              target_f = float(target.replace(",", "")) if target else None

              er_dansk = ticker.endswith(".CO")
              pos = engine.beregn_position(
                  score, cash_dkk, cash_usd, er_dansk=er_dansk, circuit_faktor=samlet_faktor,
                  entry=entry_f, stop=stop_f, target=target_f, total_portfolio_dkk=total_portfolio_dkk,
                  ticker=ticker, cash_endavu=cash_endavu,
              )

              if pos["for_lille"]:
                  print(f"{ticker}: position for lille ({pos['beloeb']} {pos['valuta']}) — udeladt")
                  continue

              beloeb_txt = f"{pos['beloeb']:,.0f} {pos['valuta']} · {pos['platform']}" if pos["valuta"] == "DKK" \
                  else f"${pos['beloeb']:.0f} · {pos['platform']}"

              koeb_linjer.append(
                  f"🟢 **{ticker}** · Score {score:.1f}/10\n"
                  f"   Køb: **${entry or '?'}** · Stop: ${stop or '?'} · Mål: ${target or '?'}\n"
                  f"   Investér: {beloeb_txt}"
              )

          # Byg beskeden
          dele = [makro_linje, ""]

          if sael_linjer:
              dele.append("**⚠️ HANDLING PÅKRÆVET**")
              dele.extend(sael_linjer)
              dele.append("")

          if koeb_linjer:
              dele.append("**📈 KØB I DAG**")
              dele.append("")
              dele.append("\n\n".join(koeb_linjer))
          else:
              dele.append("**📭 Ingen signaler i dag**")
              dele.append("_(enten ingen kandidater, eller positionerne var under minimumsgrænsen)_")

          payload = {
              "username": "AI Aktie Rådgiver",
              "embeds": [{
                  "description": "\n".join(dele),
                  "color": farve
              }]
          }

          r = requests.post(discord_url, json=payload, timeout=15)
          print(f"Discord: {r.status_code} — {len(koeb_linjer)} køb, {len(sael_linjer)} sælg")
          PYTHON
